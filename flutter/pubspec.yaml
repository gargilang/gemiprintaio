name: gemiprint
description: "gemiprint - Aplikasi manajemen bisnis percetakan"
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  intl: ^0.20.2
  uuid: ^4.5.1
  flutter_svg: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/

  fonts:
    - family: TwCenMT
      fonts:
        - asset: assets/fonts/TwCenMTStd.otf
          weight: 400
        - asset: assets/fonts/TwCenMTStdSemiBold.otf
          weight: 600
        - asset: assets/fonts/TwCenMTStdBold.otf
          weight: 700
        - asset: assets/fonts/TwCenMTStdExtraBold.otf
          weight: 800
    - family: Bauhaus93
      fonts:
        - asset: assets/fonts/BAUHS93.ttf
          weight: 400
    - family: Bauhaus
      fonts:
        - asset: assets/fonts/BauhausRegular.ttf
          weight: 400
        - asset: assets/fonts/BauhausBold.ttf
          weight: 700
