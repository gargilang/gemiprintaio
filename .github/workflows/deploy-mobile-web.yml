name: Deploy Mobile Web

on:
  push:
    branches: [main]
    paths:
      - "flutter/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-mobile-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build Flutter web
        working-directory: flutter
        run: flutter build web --release --dart-define=API_BASE_URL=https://app.gemiprint.com

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel production
        id: deploy
        working-directory: flutter/build/web
        run: |
          url="$(vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"

      - name: Alias to m.gemiprint.com
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" m.gemiprint.com \
            --scope gemiprint --token=${{ secrets.VERCEL_TOKEN }}
